name: CI/CD Python Packaging

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml
    - name: Install & Test
      run: |
        pip install --upgrade pip
        make install-dev
        make ci  # format-check lint test

  metrics:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Metrics
      run: |
        pip install --upgrade pip
        make install-dev
        make metrics-all

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Build
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        pip install build twine
        make build
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*

  deploy-testpypi:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # OIDC trusted publishing (recommandé)
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1.1.0  # Auto OIDC
      with:
        repository-url: https://test.pypi.org/legacy/
        # Ou legacy token: password: ${{ secrets.TEST_PYPI_TOKEN }}

  deploy-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish PyPI
      uses: pypa/gh-action-pypi-publish@release/v1.1.0

