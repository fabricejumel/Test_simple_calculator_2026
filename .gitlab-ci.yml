# .gitlab-ci.yml
image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv

before_script:
  - python -m venv .venv
  - source .venv/bin/activate
  - make install

stages:
  - format
  - lint
  - test

format:
  stage: format
  script:
    - make format-check

lint:
  stage: lint
  script:
    - make lint

test:
  stage: test
  script:
    - make test
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
